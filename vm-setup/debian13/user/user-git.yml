# ansible-playbook user/user-git.yml --ask-become-pass
---
- name: Git config for current user
  hosts: localhost
  become: true

  vars:
    current_user: "{{ ansible_env.SUDO_USER }}"

  vars_prompt:
    - name: git_user_name
      prompt: Git user name
      default: "{{ lookup('pipe', 'git config --global --get user.name || true') }}"
      private: false
    - name: git_user_email
      prompt: Git user email
      default: "{{ lookup('pipe', 'git config --global --get user.email || true') }}"
      private: false

  tasks:
    - name: Require git_user_name and git_user_email
      assert:
        that:
          - git_user_name | default('', true) | trim | length > 0
          - git_user_email | default('', true) | trim | length > 0
        fail_msg: git_user_name and git_user_email are mandatory

    # --- git config ---
    - name: Set git user name
      git_config:
        name: user.name
        value: "{{ git_user_name }}"
        scope: global
      become_user: "{{ current_user }}"

    - name: Set git user email
      git_config:
        name: user.email
        value: "{{ git_user_email }}"
        scope: global
      become_user: "{{ current_user }}"

    - name: Set git core options
      git_config:
        name: "core.{{ item.name }}"
        value: "{{ item.value }}"
        scope: global
      become_user: "{{ current_user }}"
      loop:
        - { name: autocrlf, value: input }
        - { name: ignorecase, value: "false" }
        - { name: editor, value: nano }

    - name: Set git default branch to main
      git_config:
        name: init.defaultBranch
        value: main
        scope: global
      become_user: "{{ current_user }}"

    - name: Set git aliases
      git_config:
        name: "alias.{{ item.name }}"
        value: "{{ item.value }}"
        scope: global
      become_user: "{{ current_user }}"
      loop:
        - { name: hist, value: "log --oneline" }
        - { name: sshow, value: "show --show-signature" }
        - { name: fpush, value: "push --force-with-lease origin HEAD" }
        - { name: ppush, value: "push origin HEAD" }

    - name: Include gh gitconfig for /home/projects
      git_config:
        name: "includeIf.gitdir:/home/projects/.path"
        value: /home/projects/.gh.gitconfig
        scope: global
      become_user: "{{ current_user }}"
